name = "creative-draft"
title = "Creative Drafting"
tier = 2                  # 1 | 2 | 3 | "sprint" (a sprint also needs expires = "YYYY-MM-DD")
status = "active"        # active | paused | archived
cadence = ["sun-pm"]   # days this env owns; optional slot: "sat-am", "sun-pm"
mode = "passenger"       # socratic | project | passenger
terminal = "forbidden"   # forbidden | plumbing | allowed
register = "fluent"        # plain | fluent
exit_test = "none"       # spoken | written | none
grill = false             # may tp:grill (quiz, test, assignment) run here?
anki_deck = ""           # defaults to the env name
