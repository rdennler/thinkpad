name = "project"
title = "Make a Real Project"
tier = 1                  # 1 | 2 | 3 | "sprint" (a sprint also needs expires = "YYYY-MM-DD")
status = "active"        # active | paused | archived
cadence = ["tue", "sat-am"]   # days this env owns; optional slot: "sat-am", "sun-pm"
mode = "project"      # socratic | project | passenger
terminal = "allowed"   # forbidden | plumbing | allowed
register = "plain"        # plain | fluent
exit_test = "spoken"       # spoken | written | none
grill = true             # may tp:grill (quiz, test, assignment) run here?
anki_deck = ""           # defaults to the env name
