name = "math-science"
title = "Math & Science"
tier = 1                  # 1 | 2 | 3 | "sprint" (a sprint also needs expires = "YYYY-MM-DD")
status = "active"        # active | paused | archived
cadence = ["mon", "wed"]   # days this env owns; optional slot: "sat-am", "sun-pm"
mode = "socratic"       # socratic | project | passenger
terminal = "forbidden"   # forbidden | plumbing | allowed
register = "plain"        # plain | fluent
exit_test = "written"       # spoken | written | none
grill = true             # may tp:grill (quiz, test, assignment) run here?
anki_deck = ""           # defaults to the env name
